<script>
  // Shows errors on screen (there is no console on iPhone).
  (function () { var L = function (t, a) { try { var el = document.getElementById('log'); if (el) el.textContent += '[' + t + '] ' + Array.prototype.map.call(a, function (x) { return x && x.message ? x.message : String(x); }).join(' ') + '\n'; } catch (e) {} };
    ['log', 'warn', 'error'].forEach(function (t) { var o = console[t]; console[t] = function () { L(t, arguments); o.apply(console, arguments); }; }); })();
  function showErr(msg) { var e = document.getElementById('err'); e.style.display = 'block'; e.textContent += msg + '\n'; }
  window.addEventListener('error', function (e) { showErr('Error: ' + e.message + (e.lineno ? ' (line ' + e.lineno + ')' : '')); });
  window.addEventListener('unhandledrejection', function (e) { showErr('Error: ' + (e.reason && e.reason.message || e.reason)); });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
window.__moduleLoaded = true;

// =================================================================
//  SETTINGS — file names must match your GitHub files EXACTLY.
// =================================================================
// Where your files live. The game tries these in order until one works.
const GITHUB_USER = 'chdineshkumar415-source', GITHUB_REPO = 'himalayan-trekking-game', BRANCH = 'main';
const PAGES_URL = `https://${GITHUB_USER}.github.io/${GITHUB_REPO}/`;
const SOURCES = [
  { name: 'this website (same folder)', base: new URL('./', location.href).href },
  { name: 'GitHub Pages', base: PAGES_URL },
  { name: 'GitHub raw', base: `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${BRANCH}/` },
  { name: 'jsDelivr mirror of GitHub', base: `https://cdn.jsdelivr.net/gh/${GITHUB_USER}/${GITHUB_REPO}@${BRANCH}/` },
].filter((s, i, all) => all.findIndex(o => o.base === s.base) === i);
const REQUIRED = ['traveler', 'firTrees'];   // the game will not start without these
const FILES = {
  traveler:  'traveler.glb',
  tent:      'tent.glb',
  campfire:  'campfire.glb',
  mountain:  'snowy_mountain_-_terrain.glb',
  firTrees:  'realistic_fir_trees_pack_lods_gameready.glb',
  snowPines: 'snow_pine_tree_and_bush_pack_lowpoly.glb',
  rockFormation: '3d_scanned_snowy_rock_formation.glb',
  rock:      'w041_snowy_rock_-_free_version.glb',
  skyDay:    'sunflowers_puresky_1k.hdr',
  skyNight:  'qwantani_night_puresky_1k.hdr',
  snowColor: 'Snow014_1K-JPG_Color.jpg',
  snowNormal:'Snow014_1K-JPG_NormalGL.jpg',
};
const SIZES = { traveler: 3.85, tent: 7.5, campfire: 3.06, mountain: 15.98, firTrees: 17.25, snowPines: 4.61,
  rockFormation: 11.1, rock: 3.07, skyDay: 1.48, skyNight: 1.39, snowColor: 0.72, snowNormal: 1.67 }; // MB
const QUALITY = {
  full: { pixelRatio: 1.5, maxPixelRatio: 2, shadow: 1024, treeStep: 6.6, lod1: 30, lod2: 95, texMax: 1024, skip: [] },
  lite: { pixelRatio: 1.2, maxPixelRatio: 1.5, shadow: 512, treeStep: 8.2, lod1: 20, lod2: 62, texMax: 512, skip: ['mountain', 'rockFormation'] },
};
const PLAYER = { walk: 2.2, run: 4.8, height: 1.75, yawOffset: 0, drain: 16, regenWalk: 8, regenIdle: 18 };
let Q = QUALITY.full;

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);

// =================================================================
//  WORLD SHAPE — terrain height, trail, campsite (pure maths)
// =================================================================
const WORLD = { size: 640, cx: 0, cz: -20, playRadius: 235, baseAlt: 2700 };
const TRAIL_POINTS = [[0,132],[6,112],[15,88],[3,64],[-9,44],[2,22],[14,2],[6,-22],[-10,-44],[-4,-70],[-18,-96],[-12,-120],[-26,-140],[-32,-158]];
const CAMP = { x: -32, z: -160, radius: 22, name: 'Juda Ka Talab Camp' };
const LAKE = { x: -6, z: -180, radius: 10 };

function makeRng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hash2(ix, iz) { let h = Math.imul(ix, 374761393) + Math.imul(iz, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function noise2(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z), fx = x - ix, fz = z - iz;
  const ux = fx * fx * (3 - 2 * fx), uz = fz * fz * (3 - 2 * fz);
  const a = hash2(ix, iz), b = hash2(ix + 1, iz), c = hash2(ix, iz + 1), d = hash2(ix + 1, iz + 1);
  return (a + (b - a) * ux + (c - a) * uz + (a - b - c + d) * ux * uz) * 2 - 1;
}
function fbm(x, z, oct = 4) { let s = 0, amp = 0.5, f = 1, n = 0; for (let i = 0; i < oct; i++) { s += noise2(x * f + i * 17.3, z * f - i * 9.1) * amp; n += amp; amp *= 0.5; f *= 2.03; } return s / n; }
const smoothstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;

const trailPath = (() => {
  const P = TRAIL_POINTS, out = [];
  const cr = (p0, p1, p2, p3, t) => 0.5 * (2 * p1 + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t * t + (-p0 + 3 * p1 - 3 * p2 + p3) * t * t * t);
  for (let i = 0; i < P.length - 1; i++) {
    const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];
    const steps = Math.ceil(Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) / 0.5);
    for (let s = 0; s < steps; s++) { const t = s / steps; out.push([cr(p0[0], p1[0], p2[0], p3[0], t), cr(p0[1], p1[1], p2[1], p3[1], t)]); }
  }
  out.push(P[P.length - 1].slice());
  return out;
})();

const GN = 512, MINX = WORLD.cx - WORLD.size / 2, MINZ = WORLD.cz - WORLD.size / 2, CELL = WORLD.size / (GN - 1);
const trailGrid = (() => {
  const g = new Float32Array(GN * GN).fill(1e9);
  for (const [px, pz] of trailPath) {
    const cx = Math.round((px - MINX) / CELL), cz = Math.round((pz - MINZ) / CELL);
    for (let dz = -3; dz <= 3; dz++) for (let dx = -3; dx <= 3; dx++) {
      const gx = cx + dx, gz = cz + dz; if (gx < 0 || gz < 0 || gx >= GN || gz >= GN) continue;
      const d = Math.hypot(MINX + gx * CELL - px, MINZ + gz * CELL - pz), k = gz * GN + gx; if (d < g[k]) g[k] = d;
    }
  }
  const a = CELL, b = CELL * Math.SQRT2, N = GN;
  for (let z = 0; z < N; z++) for (let x = 0; x < N; x++) { const k = z * N + x; let v = g[k];
    if (x > 0) v = Math.min(v, g[k - 1] + a);
    if (z > 0) { v = Math.min(v, g[k - N] + a); if (x > 0) v = Math.min(v, g[k - N - 1] + b); if (x < N - 1) v = Math.min(v, g[k - N + 1] + b); } g[k] = v; }
  for (let z = N - 1; z >= 0; z--) for (let x = N - 1; x >= 0; x--) { const k = z * N + x; let v = g[k];
    if (x < N - 1) v = Math.min(v, g[k + 1] + a);
    if (z < N - 1) { v = Math.min(v, g[k + N] + a); if (x < N - 1) v = Math.min(v, g[k + N + 1] + b); if (x > 0) v = Math.min(v, g[k + N - 1] + b); } g[k] = v; }
  return g;
})();
function trailDistance(x, z) {
  let gx = Math.min(GN - 1.001, Math.max(0, (x - MINX) / CELL)), gz = Math.min(GN - 1.001, Math.max(0, (z - MINZ) / CELL));
  const ix = Math.floor(gx), iz = Math.floor(gz), fx = gx - ix, fz = gz - iz, k = iz * GN + ix, g = trailGrid;
  return lerp(lerp(g[k], g[k + 1], fx), lerp(g[k + GN], g[k + GN + 1], fx), fz);
}
function largeHeight(x, z) {
  let h = (132 - z) * 0.11 + fbm(x * 0.006 + 3.1, z * 0.006 - 7.7, 4) * 12;
  const bowl = smoothstep(195, 320, Math.hypot(x - WORLD.cx, z - WORLD.cz));
  return h + bowl * bowl * 95;
}
const campH = largeHeight(CAMP.x, CAMP.z), lakeH = largeHeight(LAKE.x, LAKE.z);
function heightAt(x, z) {
  let h = largeHeight(x, z);
  const dT = trailDistance(x, z), onTrail = 1 - smoothstep(2, 9, dT);
  h += (fbm(x * 0.035 + 50, z * 0.035, 3) * 2.6 + fbm(x * 0.12, z * 0.12, 2) * 0.35) * (1 - onTrail);
  h -= (1 - smoothstep(0.6, 2.2, dT)) * 0.18;
  h = lerp(h, campH, 1 - smoothstep(CAMP.radius - 6, CAMP.radius + 10, Math.hypot(x - CAMP.x, z - CAMP.z)));
  h = lerp(h, lakeH - 0.9, 1 - smoothstep(LAKE.radius - 1, LAKE.radius + 4, Math.hypot(x - LAKE.x, z - LAKE.z)));
  return h;
}
const START = { x: trailPath[4][0], z: trailPath[4][1] }; START.y = heightAt(START.x, START.z);
const altitudeAt = y => Math.round(WORLD.baseAlt + (y - START.y) * 2.6);

function scatter() {
  const rng = makeRng(7), trees = [], saplings = [], bushes = [], bigRocks = [], smallRocks = [];
  const R = WORLD.size / 2 - 8, inPlay = (x, z) => Math.hypot(x - WORLD.cx, z - WORLD.cz) < 262;
  const clear = (x, z, e = 0) => Math.hypot(x - CAMP.x, z - CAMP.z) > CAMP.radius + 3 + e && Math.hypot(x - LAKE.x, z - LAKE.z) > LAKE.radius + 4 + e;
  const st = Q.treeStep;
  for (let gz = -R; gz <= R; gz += st) for (let gx = -R; gx <= R; gx += st) {
    const x = WORLD.cx + gx + (rng() - 0.5) * st * 0.9, z = WORLD.cz + gz + (rng() - 0.5) * st * 0.9;
    const r1 = rng(), r2 = rng(), r3 = rng();
    if (!inPlay(x, z) || !clear(x, z)) continue;
    const dT = trailDistance(x, z); if (dT < 4.2) continue;
    let p = 0.42 + fbm(x * 0.02 + 11, z * 0.02 - 4, 3) * 0.75; if (dT < 9) p *= 0.45;
    if (r1 > p) continue;
    trees.push({ x, z, y: heightAt(x, z), rot: r2 * Math.PI * 2, scale: 0.75 + r3 * 0.6 });
  }
  for (let i = 0; i < 260; i++) {
    const x = WORLD.cx + (rng() - 0.5) * 500, z = WORLD.cz + (rng() - 0.5) * 500, r = rng(), s = rng();
    if (trailDistance(x, z) < 3.8 || !inPlay(x, z) || !clear(x, z, -4)) continue;
    saplings.push({ x, z, y: heightAt(x, z), rot: r * 6.283, scale: 0.6 + s * 0.7 });
  }
  for (let i = 0; i < 160; i++) {
    const k = Math.floor(rng() * trailPath.length), [px, pz] = trailPath[k], a = rng() * 6.283, d = 3 + rng() * 9;
    const x = px + Math.cos(a) * d, z = pz + Math.sin(a) * d;
    if (trailDistance(x, z) < 2.8 || !clear(x, z, -6)) continue;
    bushes.push({ x, z, y: heightAt(x, z) - 0.05, rot: a, scale: 0.7 + rng() * 0.8 });
  }
  for (let i = 0; i < 70 && bigRocks.length < 30; i++) {
    const x = WORLD.cx + (rng() - 0.5) * 480, z = WORLD.cz + (rng() - 0.5) * 480, r = rng(), s = rng();
    if (trailDistance(x, z) < 7 || !clear(x, z, 2)) continue;
    bigRocks.push({ x, z, y: heightAt(x, z) - 0.6, rot: r * 6.283, scale: 2.2 + s * 3.5 });
  }
  for (let i = 30; i < trailPath.length - 40; i += 12 + Math.floor(rng() * 16)) {
    const [px, pz] = trailPath[i], [qx, qz] = trailPath[i + 1], tx = qx - px, tz = qz - pz, L = Math.hypot(tx, tz) || 1;
    const side = rng() < 0.5 ? -1 : 1, off = 2.7 + rng() * 1.4, x = px - tz / L * off * side, z = pz + tx / L * off * side;
    smallRocks.push({ x, z, y: heightAt(x, z) - 0.12, rot: rng() * 6.283, scale: 0.35 + rng() * 0.7 });
  }
  return { trees, saplings, bushes, bigRocks, smallRocks };
}

// =================================================================

// =================================================================
//  LOADING — downloads each file, checks it, and records the exact
//  reason if something goes wrong (shown on screen; no stand-ins).
// =================================================================
const gltfLoader = new GLTFLoader(), rgbeLoader = new RGBELoader(), texLoader = new THREE.TextureLoader();

function updateBar(label) {
  let got = 0; for (const k in progress) got += progress[k];
  $('bar').style.width = Math.min(100, Math.round(got / totalMB * 100)) + '%';
  if (label) $('status').textContent = label;
}
// Download a file with progress, and explain any failure in plain words.
async function download(url, key) {
  let res;
  try { res = await fetch(url, { mode: 'cors', cache: 'default' }); }
  catch (e) { throw new Error('could not connect (blocked, offline, or not allowed from this page) — ' + e.message); }
  if (!res.ok) throw new Error(`server answered HTTP ${res.status}${res.status === 404 ? ' (file not found at this address)' : ''}`);
  const total = Number(res.headers.get('content-length')) || SIZES[key] * 1048576;

    const reader = res.body.getReader(), chunks = []; let got = 0;
    for (;;) { const { done, value } = await reader.read(); if (done) break; chunks.push(value); got += value.length; progress[key] = SIZES[key] * Math.min(1, got / total); updateBar(); }
    const out = new Uint8Array(got); let o = 0; for (const c of chunks) { out.set(c, o); o += c.length; } buf = out.buffer;

}
function checkBytes(buf, kind) {

  if (head.startsWith('version https://git-lfs')) throw new Error('this is a Git LFS pointer, not the real file — re-upload the file without LFS');
  if (/^\s*<(!doctype|html)/i.test(head)) throw new Error('got a web page instead of the file (wrong address)');
  if (kind === 'gltf' && head.slice(0, 4) !== 'glTF') throw new Error('file is not a valid .glb (wrong format or damaged upload)');
  if (kind === 'hdr' && !head.startsWith('#?')) throw new Error('file is not a valid .hdr');
}
async function parse(buf, kind) {

}
async function load(key, kind) {
  if (Q.skip.includes(key)) return null;
  const r = report[key] = { ok: false, tries: [] };
  for (const src of SOURCES) {
    const url = src.base + encodeURI(FILES[key]);
    try {
      updateBar('Downloading ' + FILES[key] + '…');
      const buf = await download(url, key);
      checkBytes(buf, kind);
      let result;
      try { result = await parse(buf, kind); }
      catch (e) { throw new Error('downloaded OK but could not be read: ' + (e.message || e)); }
      progress[key] = SIZES[key]; r.ok = true; r.from = src.name;
      updateBar('Loaded ' + FILES[key]);
      console.log('[assets] ✓', FILES[key], 'from', src.name);
      return result;
    } catch (e) {
      r.tries.push(`${src.name}: ${e.message || e}`);
      console.warn('[assets] ✗', FILES[key], 'from', url, '→', e.message || e);
    }
  }
  progress[key] = SIZES[key]; updateBar('Could not load ' + FILES[key]);
  return null;
}
function showReport(fatal) {
  const lines = [];
  for (const k of Object.keys(FILES)) {
    const r = report[k]; if (!r) continue;
    if (r.ok) lines.push(`<div class="ok">✓ ${FILES[k]} <span>(${r.from})</span></div>`);
    else lines.push(`<div class="bad">✗ <b>${FILES[k]}</b>${REQUIRED.includes(k) ? ' — required' : ' — skipped'}<ul>${r.tries.map(t => '<li>' + t + '</li>').join('')}</ul></div>`);
  }
  $('report').innerHTML = lines.join('');
  $('report').style.display = 'block';
  if (fatal) {
    $('status').innerHTML = '<b>Some required models could not load.</b><br>' + explainWhere();

}
function explainWhere() {
  if (location.protocol === 'file:' || location.protocol === 'blob:' || location.origin === 'null')
    return 'This page was opened as a file, not as a website. Open it from GitHub Pages:<br><b>' + PAGES_URL + '</b>';
  if (!location.hostname.endsWith('github.io'))
    return 'This page is not running on your GitHub Pages site. Open:<br><b>' + PAGES_URL + '</b>';
  return 'Check that the file names on GitHub match exactly (capital letters matter) and that the files are in the same folder as index.html.';
}

function makeTerrain(tColor, tNormal) {
  const SEG = Q === QUALITY.lite ? 150 : 200;
  const geo = new THREE.PlaneGeometry(WORLD.size, WORLD.size, SEG, SEG);
  geo.rotateX(-Math.PI / 2); geo.translate(WORLD.cx, 0, WORLD.cz);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, heightAt(p.getX(i), p.getZ(i)));
  geo.computeVertexNormals();
  const data = new Uint8Array(GN * GN); for (let i = 0; i < data.length; i++) data[i] = Math.min(255, trailGrid[i] * 10);
  const trailTex = new THREE.DataTexture(data, GN, GN, THREE.RedFormat, THREE.UnsignedByteType);
  trailTex.magFilter = trailTex.minFilter = THREE.LinearFilter; trailTex.needsUpdate = true;
  const rep = WORLD.size / 3.5;
  for (const t of [tColor, tNormal]) if (t) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep); t.anisotropy = 4; }
  if (tColor) tColor.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, map: tColor, normalMap: tNormal, roughness: 0.92, metalness: 0 });
  mat.onBeforeCompile = s => {
    s.uniforms.uTrailTex = { value: trailTex };
    s.uniforms.uTrailInfo = { value: new THREE.Vector4(MINX, MINZ, CELL, GN) };
    s.vertexShader = 'varying vec2 vXZ;\n' + s.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n vXZ = ( modelMatrix * vec4( transformed, 1.0 ) ).xz;');
    s.fragmentShader = 'uniform sampler2D uTrailTex; uniform vec4 uTrailInfo; varying vec2 vXZ; float trailK;\n' + s.fragmentShader
      .replace('#include <map_fragment>', `
        {
          vec2 g = ( vXZ - uTrailInfo.xy ) / uTrailInfo.z;
          float d = texture2D( uTrailTex, ( g + 0.5 ) / uTrailInfo.w ).r * 25.5;
          #ifdef USE_MAP
            d += ( texture2D( map, vMapUv * 0.21 ).r - 0.7 ) * 2.0;
          #endif
          trailK = 1.0 - smoothstep( 1.2, 2.2, d );
        }

        #ifdef USE_MAP
          diffuseColor.rgb *= 0.9 + texture2D( map, vMapUv * 0.043 ).g * 0.15;
        #endif
        diffuseColor.rgb = mix( diffuseColor.rgb, diffuseColor.rgb * vec3( 0.6, 0.6, 0.68 ) + vec3( 0.03, 0.025, 0.02 ), trailK );`)
      .replace('#include <roughnessmap_fragment>', '#include <roughnessmap_fragment>\n roughnessFactor = mix( roughnessFactor, 0.62, trailK );')

}

// distant ring of Himalayan peaks (cheap, procedural)
function makeRingMountains() {
  const A = 200, R = 28, pos = new Float32Array((A + 1) * (R + 1) * 3), idx = [];
  const peakX = -120, peakZ = -1050;
  for (let r = 0; r <= R; r++) for (let a = 0; a <= A; a++) {
    const th = a / A * Math.PI * 2, rad = 300 + Math.pow(r / R, 1.4) * 1700;
    const x = WORLD.cx + Math.cos(th) * rad, z = WORLD.cz + Math.sin(th) * rad;
    const ridge = 1 - Math.abs(fbm(x * 0.0021, z * 0.0021, 5));
    let h = smoothstep(300, 760, rad) * (60 + Math.pow(ridge, 2.2) * 520);
    const dp = Math.hypot(x - peakX, z - peakZ); h += Math.exp(-dp * dp / (2 * 230 * 230)) * 560;
    const k = (r * (A + 1) + a) * 3;
    pos[k] = x; pos[k + 1] = (132 - Math.max(-500, Math.min(400, z))) * 0.11 + 73 + h; pos[k + 2] = z;
  }
  for (let r = 0; r < R; r++) for (let a = 0; a < A; a++) { const i0 = r * (A + 1) + a, i2 = i0 + A + 1; idx.push(i0, i0 + 1, i2, i0 + 1, i2 + 1, i2); }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setIndex(idx); geo.computeVertexNormals();
  const n = geo.attributes.normal.array, col = new Float32Array(pos.length);
  for (let i = 0; i < pos.length; i += 3) {
    const snow = smoothstep(0.55, 0.78, n[i + 1] + (pos[i + 1] > 380 ? 0.12 : 0)), forest = (1 - smoothstep(130, 230, pos[i + 1])) * smoothstep(0.5, 0.8, n[i + 1]);
    col[i] = (0.3 + 0.62 * snow) * (1 - forest * 0.75); col[i + 1] = (0.29 + 0.65 * snow) * (1 - forest * 0.68); col[i + 2] = (0.33 + 0.67 * snow) * (1 - forest * 0.66);
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const mat = new THREE.MeshLambertMaterial({ vertexColors: true }); applyHaze(mat, 0.2);
  const m = new THREE.Mesh(geo, mat); m.frustumCulled = false; return m;
}

  root.traverse(o => { if (o.isMesh) { const g = o.geometry.clone(); g.applyMatrix4(o.matrixWorld); g.deleteAttribute('tangent'); parts.push({ geometry: g, material: convert(o.material) }); } });

// Each detail level is fitted on its own so they all line up (same height, base on the ground).
function normalizeLods(lods, size, byMax = false) {
  let height = size;

    const box = new THREE.Box3();
    for (const p of lod) { p.geometry.computeBoundingBox(); box.union(p.geometry.boundingBox); }
    const s = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());

//  CAMPFIRE FLAMES (animated shader) + embers

    input.lookDX = input.lookDY = 0; input.lastLook = t;
  }
  const mag = Math.min(1, Math.hypot(input.mx, input.my));
  let dx = -Math.sin(state.yaw) * input.my + Math.cos(state.yaw) * input.mx;
  let dz = -Math.cos(state.yaw) * input.my - Math.sin(state.yaw) * input.mx;
  const dl = Math.hypot(dx, dz), p = player.position;
  const wantsRun = input.run && mag > 0.3 && !state.tired;
  if (dl > 0.01) {
    dx /= dl; dz /= dl;
    const up = Math.max(0, (heightAt(p.x + dx * 0.8, p.z + dz * 0.8) - heightAt(p.x, p.z)) / 0.8);
    const target = (wantsRun ? PLAYER.run : PLAYER.walk) * Math.max(0.35, mag) * (1 - Math.min(0.45, up * 0.9));
    state.speed += (target - state.speed) * Math.min(1, dt * 6);
    let diff = Math.atan2(dx, dz) - state.facing; diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    state.facing += diff * Math.min(1, dt * 10);
    if (t - input.lastLook > 1.5 && input.my > 0.4) { let d = Math.atan2(-dx, -dz) - state.yaw; d = Math.atan2(Math.sin(d), Math.cos(d)); state.yaw += d * Math.min(1, dt * 0.9); }
    state.stamina += wantsRun ? -PLAYER.drain * (1 + up * 1.5) * dt : PLAYER.regenWalk * dt;
    state.mx = dx; state.mz = dz;
  } else {
    state.speed += -state.speed * Math.min(1, dt * 8); state.stamina += PLAYER.regenIdle * dt;
  }
  if (state.speed > 0.01 && state.mx !== undefined) { p.x += state.mx * state.speed * dt; p.z += state.mz * state.speed * dt; }
  state.stamina = Math.max(0, Math.min(100, state.stamina));
  if (state.stamina <= 0 && !state.tired) { state.tired = true; showBanner('Out of breath', 'Walk slowly to recover — the air is thin up here.', 3); }
  if (state.tired && state.stamina > 35) state.tired = false;
  // collisions
  const gx = Math.floor(p.x / 8), gz = Math.floor(p.z / 8);
  for (let ix = gx - 1; ix <= gx + 1; ix++) for (let iz = gz - 1; iz <= gz + 1; iz++) {
    const list = colGrid.get(ix + ',' + iz); if (!list) continue;
    for (const c of list) { const ex = p.x - c.x, ez = p.z - c.z, d = Math.hypot(ex, ez), m = c.r + 0.35; if (d < m && d > 1e-4) { p.x = c.x + ex / d * m; p.z = c.z + ez / d * m; } }
  }
  const cx = p.x - WORLD.cx, cz = p.z - WORLD.cz, cr = Math.hypot(cx, cz);
  if (cr > WORLD.playRadius) { p.x = WORLD.cx + cx / cr * WORLD.playRadius; p.z = WORLD.cz + cz / cr * WORLD.playRadius; }
  p.y += (heightAt(p.x, p.z) - 0.04 - p.y) * Math.min(1, dt * 20);   // stand on the snow
  player.rotation.y = state.facing;
  // animation
  const moving = state.speed > 0.12;
  state.walkW += ((moving ? 1 : 0) - state.walkW) * Math.min(1, dt * 7);
  setWeights(state.walkW);
  if (actions) actions.walk.timeScale = Math.max(0.6, state.speed / 1.45);
  if (mixer) mixer.update(dt);
  // footsteps
  if (moving) { state.lastStep += dt * state.speed; if (state.lastStep > 0.75) { state.lastStep = 0; sound.burst(state.speed > 3 ? 0.45 : 0.3, 900 + Math.random() * 500, 0.16); } }
  // fire crackle when near the camp
  const fd = p.distanceTo(campfirePos); if (fd < 18 && Math.random() < dt * 6) sound.burst(Math.min(0.35, 2 / (fd + 2)), 3000 + Math.random() * 3000, 0.04);
  // checkpoint
  if (!state.done && Math.hypot(p.x - checkpoint.position.x, p.z - checkpoint.position.z) < 3.2) {
    state.done = true; const time = (performance.now() - state.startTime) / 1000;
    showBanner('⛺ Checkpoint reached', CAMP.name + ' · ' + fmt(time), 8);
  }
}
function updateCamera(dt) {
  const p = player.position; camTarget.set(p.x, p.y + 1.5, p.z);
  const d = state.camDist + (state.speed > PLAYER.walk + 0.5 ? 0.8 : 0);
  camWant.set(camTarget.x + Math.sin(state.yaw) * Math.cos(state.pitch) * d, camTarget.y + Math.sin(state.pitch) * d, camTarget.z + Math.cos(state.yaw) * Math.cos(state.pitch) * d);
  camWant.y = Math.max(camWant.y, heightAt(camWant.x, camWant.z) + 0.6);
  camera.position.lerp(camWant, 1 - Math.exp(-dt * 10)); camera.lookAt(camTarget);
}
function updateSun() {
  const p = player.position, texel = 56 / Q.shadow, x = Math.round(p.x / texel) * texel, z = Math.round(p.z / texel) * texel;
  const dir = sky.isNight ? MOON_DIR : SUN_DIR;
  sun.target.position.set(x, p.y, z); sun.position.set(x + dir.x * 120, p.y + dir.y * 120, z + dir.z * 120); sun.target.updateMatrixWorld();
}
function updateLods(force) {
  if (!force && camera.position.distanceToSquared(lastLodPos) < 0.04 && camera.quaternion.angleTo(lastLodQ) < 0.004) return;
  lastLodPos.copy(camera.position); lastLodQ.copy(camera.quaternion);
  camera.updateMatrixWorld(); pv.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse); frustum.setFromProjectionMatrix(pv);
  for (const s of lodSets) s.update(camera.position, frustum);
  if (heroRock) heroRock.visible = camera.position.distanceTo(heroRock.position) < 260;
}
function updateHUD() {
  const st = $('stam'); st.style.width = state.stamina.toFixed(1) + '%'; st.classList.toggle('tired', state.tired);
  const p = player.position, cp = checkpoint.position;
  $('alt').textContent = altitudeAt(p.y).toLocaleString('en-IN') + ' m';
  if (!state.done) $('timer').textContent = fmt((performance.now() - state.startTime) / 1000);
  $('campDist').textContent = state.done ? 'Camp ✓' : Math.round(Math.hypot(cp.x - p.x, cp.z - p.z)) + ' m';
  const rel = Math.atan2(cp.x - p.x, cp.z - p.z) - Math.atan2(-Math.sin(state.yaw), -Math.cos(state.yaw));
  $('arrow').style.transform = `rotate(${-rel}rad)`;
}
const perf = { f: 0, t: 0, good: 0 };
function adapt(dt) {
  perf.f++; perf.t += dt; if (perf.t < 2) return;
  const fps = perf.f / perf.t; perf.f = perf.t = 0;
  $('fps').textContent = Math.round(fps) + ' fps · ' + pixelRatio.toFixed(2) + 'x';
  const maxPR = Math.min(devicePixelRatio || 1, Q.maxPixelRatio);
  if (fps < 45 && pixelRatio > 0.85) { pixelRatio = Math.max(0.85, pixelRatio - 0.15); perf.good = 0; }
  else if (fps > 57 && ++perf.good >= 3 && pixelRatio < maxPR) { pixelRatio = Math.min(maxPR, pixelRatio + 0.1); perf.good = 0; }
  if (Math.abs(renderer.getPixelRatio() - pixelRatio) > 0.01) { renderer.setPixelRatio(pixelRatio); renderer.setSize(innerWidth, innerHeight); }
}
let last = performance.now(), elapsed = 0;
function loop() {
  const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now; elapsed += dt;
  updatePlayer(dt, elapsed); updateCamera(dt); updateSun(); updateLods(false);
  for (const f of ticks) f(elapsed);
  updateHUD(); adapt(dt);
  renderer.render(scene, camera);
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// =================================================================
//  START
// =================================================================
async function begin(mode) {
  Q = QUALITY[mode];
  sound.init();
  $('choose').style.display = 'none'; $('loading').style.display = 'block';
  pixelRatio = Math.min(devicePixelRatio || 1, Q.pixelRatio); renderer.setPixelRatio(pixelRatio); renderer.setSize(innerWidth, innerHeight);
  const ok = await build();
  if (!ok) return;
  setNight(params.has('night'));
  updateCamera(1); camera.position.copy(camWant); camera.lookAt(camTarget);
  updateSun(); updateLods(true);
  $('status').textContent = 'Preparing shaders…';
  await new Promise(r => setTimeout(r, 30));
  renderer.compile(scene, camera);
  sound.start();
  $('start').style.display = 'none'; $('hud').style.display = 'block';
  state.startTime = performance.now(); last = performance.now();
  showBanner('Kedarkantha Trail', 'Follow the trampled path through the pines to ' + CAMP.name + '.', 5);
  renderer.setAnimationLoop(loop);
  window.__game = { state, player, camera, setNight, CAMP, heightAt };
}
$('goFull').addEventListener('click', () => begin('full'), { once: true });
$('goLite').addEventListener('click', () => begin('lite'), { once: true });
if (params.has('auto')) begin(params.get('auto') === 'lite' ? 'lite' : 'full');
</script>
</body>
